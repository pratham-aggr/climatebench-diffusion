name: diff
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  # Python
  - python=3.10
  
  # Core PyTorch and ML packages (with CUDA 12.1 support)
  # Using strict version constraints for compatibility
  - pytorch::pytorch=2.1.2=py3.10_cuda12.1_cudnn8.9.2_0
  - pytorch::torchvision=0.16.2=py310_cu121
  - pytorch::torchaudio=2.1.2=py310_cu121
  - pytorch::pytorch-cuda=12.1=ha16c6d3_6
  
  # PyTorch Lightning and related
  - pytorch-lightning>=2.0
  - torchmetrics
  
  # Configuration management
  - hydra-core
  - omegaconf
  
  # Scientific computing (NumPy <2 for PyTorch 2.1.2 compatibility)
  - numpy=1.26.4
  - scipy
  - pandas
  - scikit-learn
  
  # Data handling and I/O
  - xarray
  - netcdf4
  - h5py
  - zarr
  - fsspec
  - s3fs
  - boto3
  
  
  # Xarray extensions
  - xbatcher
  - xskillscore
  - dask
  - cachey
  
  # Deep learning utilities
  - einops
  - tensordict
  - transformers<4.45  # Pin to version compatible with PyTorch 2.1.2
  
  # Logging and monitoring
  - wandb
  - tensorboard
  - rich
  - tqdm
  
  # Plotting and visualization
  - matplotlib
  - seaborn
  - plotly
  - cartopy
  
  # Development tools
  - black>=23.1
  - isort>=5.5.4
  - ruff>=0.0.241
  - pytest
  - ipython
  - jupyter
  - ipykernel
  
  # Utilities
  - requests
  - urllib3
  - pyyaml
  - regex
  - python-dotenv
  
  # Additional scientific packages
  - cftime
  - bottleneck
  
  # Pip packages (packages not available via conda)
  # Note: torch-harmonics, timm, opencv-python-headless removed from initial install
  # to prevent pip from overriding conda torch/numpy. Install manually after if needed.using this:pip install --no-deps torch-harmonics timm opencv-python-headless hf-doc-builder
  - pip
  - pip:
    - dacite
    - properscoring

